steps:
  # 1. Build Docker image with Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg=FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg=FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg=FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '--build-arg=FIREBASE_APPCHECK_SITE_KEY=${_FIREBASE_APPCHECK_SITE_KEY}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:latest']

  # 3. Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pathfinder'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'pathfinder-cloud-run-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/pathfinder/pathfinder:latest'

substitutions:
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: 'pathfinder-4de02'
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_APPCHECK_SITE_KEY: ''
